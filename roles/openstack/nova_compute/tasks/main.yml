#- name: Read Ceph client.nova key
#  ansible.builtin.command: "ceph-authtool -p /etc/ceph/ceph.client.nova.keyring"
#  register: nova_ceph_key
#  changed_when: false
#  no_log: false

- name: Read Ceph client.nova key
  ansible.builtin.shell: |
    set -euo pipefail
    awk -F'= ' '
      /^\[client\.{{ nova_rbd_user }}\]/ {found=1}
      found && /^[[:space:]]*key[[:space:]]*=/ {print $2; exit}
    ' /etc/ceph/ceph.client.{{ nova_rbd_user }}.keyring
  args:
    executable: /bin/bash
  register: nova_ceph_key
  changed_when: false
  no_log: false

- name: Assert Ceph client.nova key was read
  ansible.builtin.assert:
    that:
      - nova_ceph_key.stdout is defined
      - nova_ceph_key.stdout | length > 20
    fail_msg: "Gagal membaca key client.nova dari /etc/ceph/ceph.client.nova.keyring"
  no_log: true

- name: Set libvirt Ceph secret value
  ansible.builtin.command: "virsh secret-set-value --secret {{ nova_rbd_secret_uuid }} --base64 {{ nova_ceph_key.stdout }}"
  no_log: false

- name: Ensure Nova lock directory exists
  ansible.builtin.file:
    path: /var/lib/nova/tmp
    state: directory
    owner: nova
    group: nova
    mode: "0755"

- name: Ensure Nova instances directory exists
  ansible.builtin.file:
    path: "{{ nova_instances_path }}"
    state: directory
    owner: nova
    group: nova
    mode: "0755"

- name: Deploy nova.conf on compute nodes
  ansible.builtin.template:
    src: nova.conf.j2
    dest: "{{ nova_conf_path }}"
    owner: root
    group: nova
    mode: "0640"
    backup: true

- name: Restart libvirt
  ansible.builtin.service:
    name: libvirtd
    state: restarted
    enabled: true

- name: Restart and enable Nova compute
  ansible.builtin.service:
    name: nova-compute
    state: restarted
    enabled: true

- name: Wait for nova-compute to settle
  ansible.builtin.pause:
    seconds: 5

- name: Check nova-compute service
  ansible.builtin.command: systemctl is-active nova-compute
  changed_when: false
