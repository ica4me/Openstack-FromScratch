- name: Create Aodh alarming service
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack service create \
      --name {{ aodh_service_name }} \
      --description "{{ aodh_service_description }}" \
      {{ aodh_service_type }}
  register: aodh_service_create
  changed_when: aodh_service_create.rc == 0
  failed_when: >
    aodh_service_create.rc != 0 and
    'Conflict occurred' not in aodh_service_create.stderr and
    'Duplicate entry' not in aodh_service_create.stderr
  when: aodh_service_check.rc != 0
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

