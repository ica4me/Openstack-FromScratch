---
- name: Assert Aodh variables exist
  ansible.builtin.assert:
    that:
      - aodh_db_password is defined
      - aodh_service_password is defined
      - aodh_endpoint is defined
      - service_endpoints.keystone is defined
      - aodh_transport_url is defined
    fail_msg: "Variabel Aodh belum lengkap."

- name: Install Aodh packages
  ansible.builtin.apt:
    name: "{{ aodh_packages }}"
    state: present
    update_cache: false
  retries: 3
  delay: 10
  register: aodh_pkg_result
  until: aodh_pkg_result is succeeded

- name: Ensure Aodh directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: aodh
    group: aodh
    mode: "0755"
  loop:
    - /var/lib/aodh
    - /var/log/aodh

- name: Ensure Aodh database exists
  community.mysql.mysql_db:
    name: "{{ aodh_database_name }}"
    state: present
    login_user: root
    login_password: "{{ vault_mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Ensure Aodh database user exists
  community.mysql.mysql_user:
    name: "{{ aodh_database_user }}"
    password: "{{ aodh_db_password }}"
    host: "{{ item }}"
    priv: "{{ aodh_database_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ vault_mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  loop:
    - "%"
    - localhost
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Check Aodh service user
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack user show {{ aodh_service_user }} --domain {{ openstack_domain }} -f value -c id
  register: aodh_user_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

#- name: Create Aodh service user
#  ansible.builtin.shell: |
#    . {{ admin_openrc_path }}
#    openstack user create {{ aodh_service_user }} \
#      --domain {{ openstack_domain }} \
#      --password '{{ aodh_service_password }}'
#  when: aodh_user_check.rc != 0
#  run_once: true
#  delegate_to: "{{ bootstrap_controller }}"
- name: Create Aodh service user
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack user create {{ aodh_service_user }} \
      --domain {{ openstack_domain }} \
      --password '{{ aodh_service_password }}'
  register: aodh_user_create
  changed_when: aodh_user_create.rc == 0
  failed_when: >
    aodh_user_create.rc != 0 and
    'Conflict occurred' not in aodh_user_create.stderr and
    'Duplicate entry' not in aodh_user_create.stderr
  when: aodh_user_check.rc != 0
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Re-check Aodh service user after create
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack user show {{ aodh_service_user }} --domain {{ openstack_domain }} -f value -c id
  register: aodh_user_recheck
  changed_when: false
  failed_when: aodh_user_recheck.rc != 0
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Assign admin role to Aodh service user
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack role add --project service --user {{ aodh_service_user }} admin
  register: aodh_role_add
  changed_when: aodh_role_add.rc == 0
  failed_when: aodh_role_add.rc != 0 and 'Conflict occurred' not in aodh_role_add.stderr
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Check Aodh service catalog
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack service show {{ aodh_service_name }} -f value -c id
  register: aodh_service_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

