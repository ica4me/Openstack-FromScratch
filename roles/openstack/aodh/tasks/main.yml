- name: Ensure Aodh endpoints exist
  ansible.builtin.shell: |
    . {{ admin_openrc_path }}
    openstack endpoint create --region {{ openstack_region }} \
      {{ aodh_service_type }} {{ item }} "{{ aodh_endpoint }}"
  register: aodh_endpoint_create
  changed_when: aodh_endpoint_create.rc == 0
  failed_when: >
    aodh_endpoint_create.rc != 0 and
    'Conflict occurred' not in aodh_endpoint_create.stderr and
    'Duplicate entry' not in aodh_endpoint_create.stderr
  loop:
    - public
    - internal
    - admin
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Deploy aodh.conf
  ansible.builtin.template:
    src: aodh.conf.j2
    dest: "{{ aodh_conf_path }}"
    owner: root
    group: aodh
    mode: "0640"
    backup: true
  notify:
    - Restart Aodh services
    - Restart Aodh API

- name: Stop and disable standalone Aodh API service if present
  ansible.builtin.service:
    name: aodh-api
    state: stopped
    enabled: false
  failed_when: false

- name: Disable packaged Aodh Apache config if present
  ansible.builtin.command: a2disconf aodh-api
  changed_when: false
  failed_when: false

- name: Disable packaged Aodh Apache site if present
  ansible.builtin.command: a2dissite aodh-api.conf
  changed_when: false
  failed_when: false

- name: Remove old Aodh Apache enabled symlink
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/aodh-api.conf
    state: absent

- name: Deploy Aodh Apache WSGI site
  ansible.builtin.template:
    src: apache-aodh.conf.j2
    dest: /etc/apache2/sites-available/aodh-api.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Aodh API

- name: Enable Aodh Apache WSGI site
  ansible.builtin.command: a2ensite aodh-api.conf
  args:
    creates: /etc/apache2/sites-enabled/aodh-api.conf
  notify: Restart Aodh API

- name: Validate Apache config after Aodh site
  ansible.builtin.command: apache2ctl configtest
  changed_when: false

- name: Check Aodh DB sync marker
  ansible.builtin.stat:
    path: "{{ aodh_db_sync_marker }}"
  register: aodh_db_sync_marker_stat
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Sync Aodh database
  ansible.builtin.command: aodh-dbsync
  become_user: aodh
  when: not aodh_db_sync_marker_stat.stat.exists
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Create Aodh DB sync marker
  ansible.builtin.file:
    path: "{{ aodh_db_sync_marker }}"
    state: touch
    owner: aodh
    group: aodh
    mode: "0600"
  when: not aodh_db_sync_marker_stat.stat.exists
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"

- name: Flush handlers before Aodh validation
  ansible.builtin.meta: flush_handlers

- name: Ensure Aodh services are enabled and started
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ aodh_services }}"

- name: Ensure Apache for Aodh API is enabled and started
  ansible.builtin.service:
    name: "{{ aodh_api_service | default('apache2') }}"
    state: started
    enabled: true

- name: Validate local Aodh API on each controller
  ansible.builtin.uri:
    url: "http://{{ aodh_api_bind_host }}:{{ aodh_api_bind_port }}"
    method: GET
    status_code: [200, 300, 401, 403]
    timeout: 15
    return_content: false
  register: aodh_api_local_check
  until: aodh_api_local_check.status in [200, 300, 401, 403]
  retries: 20
  delay: 6

- name: Validate Aodh API through VIP
  ansible.builtin.uri:
    url: "{{ aodh_endpoint }}"
    method: GET
    status_code: [200, 300, 401, 403]
    timeout: 15
    return_content: false
  register: aodh_api_vip_check
  until: aodh_api_vip_check.status in [200, 300, 401, 403]
  retries: 20
  delay: 6
  run_once: true
  delegate_to: "{{ bootstrap_controller }}"
